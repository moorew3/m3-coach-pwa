name: Build Complete-Cycle Boxing Flow

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/m3-coach-v2
    paths:
      - .github/workflows/build-boxing-flow-v3.yml

permissions:
  contents: write

jobs:
  assemble-approved-motion:
    if: github.ref == 'refs/heads/rebuild/m3-coach-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/m3-coach-v2
          persist-credentials: true

      - name: Verify media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          python3 -m py_compile scripts/build-boxing-flow-v3.py

      - name: Preserve full approved punch and guard-return clips
        run: python3 scripts/build-boxing-flow-v3.py

      - name: Check output and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s public/media/boxingFlow3.mp4
          ffprobe -v error -show_entries format=duration,size -of json public/media/boxingFlow3.mp4
          sha256sum public/media/boxingFlow3.mp4 > public/media/boxingFlow3.sha256

      - name: Commit only new approved-source video to the V2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/boxingFlow3.mp4 public/media/boxingFlow3.sha256
          if git diff --cached --quiet; then
            echo "Identical approved-source video already present"
            exit 0
          fi
          git commit -m "Add full-recovery Boxing Flow 3 video for V2 preview"
          git push origin HEAD:rebuild/m3-coach-v2
