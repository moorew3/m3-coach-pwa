name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Boxing camera feedback regression
        run: node scripts/test-boxing-form.mjs

      - name: Preserve original workouts during avatar correction
        run: node scripts/test-avatar-only-preservation.mjs

      - name: 3D asset builder syntax
        run: python3 -m py_compile scripts/assemble-coach-glb.py
