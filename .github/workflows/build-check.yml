name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Workout sequence, media integrity, and safety regression checks
        run: node --experimental-strip-types --test scripts/*.test.mjs

      - name: Verify vendor-neutral Node runtime bundle
        run: |
          test -s .output/server/index.mjs
          test -f .output/public/recovery-coach/index.html
          test -f .output/public/recovery-coach/programs/index.html
