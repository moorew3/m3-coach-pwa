name: Build Boxing Combo 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-boxing-combo.yml

permissions:
  contents: write

jobs:
  build-boxing-combo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download approved M3 Coach boxing clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/boxing public/media
          BASE="https://twenty-two-gainz-tracker.lovable.app"
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/ba2daa61-d337-44ea-9fe0-12f6698cc43f/boxingStanceV2.mp4" -o .tmp/boxing/boxingStance.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/fea6c3ab-2ad2-4c0a-8380-432cc8496e49/jabV2.mp4" -o .tmp/boxing/jab.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/767f7369-4a91-4f1e-bbe3-ad429dc80d15/crossV2.mp4" -o .tmp/boxing/cross.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/4a42a4f8-dc38-44ee-93fa-b62815263ebd/jabCrossV2.mp4" -o .tmp/boxing/jabCross.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/39d355b3-eb12-4628-98d6-107ebbd966c4/defensiveResetV2.mp4" -o .tmp/boxing/defensiveReset.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/de47b48c-3ce6-4ebc-9ee8-56ac2acb0161/guardResetV2.mp4" -o .tmp/boxing/guardReset.mp4
          for f in .tmp/boxing/*.mp4; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Build smooth Boxing Combo 2
        shell: bash
        run: |
          set -euo pipefail
          FILTER="scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,fps=30,format=yuv420p,setpts=PTS/1.08"

          # Cut the long setup/hold frames out of the source demonstrations.
          # The first version concatenated whole clips, which created the
          # stop-start pauses the user saw after a couple of punches.
          ffmpeg -y -i .tmp/boxing/boxingStance.mp4   -ss 0.20 -t 0.70 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/01.mp4
          ffmpeg -y -i .tmp/boxing/jab.mp4            -ss 0.25 -t 1.10 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/02.mp4
          ffmpeg -y -i .tmp/boxing/cross.mp4          -ss 0.25 -t 1.10 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/03.mp4
          ffmpeg -y -i .tmp/boxing/jabCross.mp4       -ss 0.25 -t 1.45 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/04.mp4
          ffmpeg -y -i .tmp/boxing/defensiveReset.mp4 -ss 0.25 -t 1.00 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/05.mp4
          ffmpeg -y -i .tmp/boxing/jabCross.mp4       -ss 0.35 -t 1.35 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/06.mp4
          ffmpeg -y -i .tmp/boxing/guardReset.mp4     -ss 0.20 -t 0.90 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/07.mp4

          # Short crossfades hide the hard edit points without adding visible
          # pauses. Final clip is roughly 6.5 seconds and loops back to guard.
          ffmpeg -y             -i .tmp/boxing/01.mp4             -i .tmp/boxing/02.mp4             -i .tmp/boxing/03.mp4             -i .tmp/boxing/04.mp4             -i .tmp/boxing/05.mp4             -i .tmp/boxing/06.mp4             -i .tmp/boxing/07.mp4             -filter_complex "              [0:v][1:v]xfade=transition=fade:duration=0.08:offset=0.57[v1];              [v1][2:v]xfade=transition=fade:duration=0.08:offset=1.51[v2];              [v2][3:v]xfade=transition=fade:duration=0.08:offset=2.45[v3];              [v3][4:v]xfade=transition=fade:duration=0.08:offset=3.71[v4];              [v4][5:v]xfade=transition=fade:duration=0.08:offset=4.56[v5];              [v5][6:v]xfade=transition=fade:duration=0.08:offset=5.73[vout]"             -map "[vout]" -an -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart             public/media/boxingCombo2.mp4

          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json public/media/boxingCombo2.mp4
          sha256sum public/media/boxingCombo2.mp4 > public/media/boxingCombo2.sha256

      - name: Commit Boxing Combo 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/boxingCombo2.mp4 public/media/boxingCombo2.sha256
          git commit -m "Add smooth Boxing Combo 2 coach motion" || exit 0
          git push
