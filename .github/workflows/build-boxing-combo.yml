name: Build Boxing Combo 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-boxing-combo.yml

permissions:
  contents: write

jobs:
  build-boxing-combo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved M3 Coach boxing clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/boxing public/media
          BASE="https://twenty-two-gainz-tracker.lovable.app"
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/ba2daa61-d337-44ea-9fe0-12f6698cc43f/boxingStanceV2.mp4" -o .tmp/boxing/boxingStance.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/fea6c3ab-2ad2-4c0a-8380-432cc8496e49/jabV2.mp4" -o .tmp/boxing/jab.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/767f7369-4a91-4f1e-bbe3-ad429dc80d15/crossV2.mp4" -o .tmp/boxing/cross.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/4a42a4f8-dc38-44ee-93fa-b62815263ebd/jabCrossV2.mp4" -o .tmp/boxing/jabCross.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/39d355b3-eb12-4628-98d6-107ebbd966c4/defensiveResetV2.mp4" -o .tmp/boxing/defensiveReset.mp4
          curl -fL --retry 3 "$BASE/__l5e/assets-v1/de47b48c-3ce6-4ebc-9ee8-56ac2acb0161/guardResetV2.mp4" -o .tmp/boxing/guardReset.mp4
          for f in .tmp/boxing/*.mp4; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Normalize and trim sequence
        shell: bash
        run: |
          set -euo pipefail
          FILTER="scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,fps=30,format=yuv420p"
          ffmpeg -y -i .tmp/boxing/boxingStance.mp4   -t 1.5 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/01.mp4
          ffmpeg -y -i .tmp/boxing/jab.mp4            -t 1.8 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/02.mp4
          ffmpeg -y -i .tmp/boxing/cross.mp4          -t 1.8 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/03.mp4
          ffmpeg -y -i .tmp/boxing/jabCross.mp4       -t 2.2 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/04.mp4
          ffmpeg -y -i .tmp/boxing/defensiveReset.mp4 -t 1.8 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/05.mp4
          ffmpeg -y -i .tmp/boxing/jabCross.mp4       -ss 0.4 -t 2.0 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/06.mp4
          ffmpeg -y -i .tmp/boxing/guardReset.mp4     -t 1.5 -vf "$FILTER" -an -c:v libx264 -preset medium -crf 20 .tmp/boxing/07.mp4

          cat > .tmp/boxing/concat.txt <<'EOF'
          file '01.mp4'
          file '02.mp4'
          file '03.mp4'
          file '04.mp4'
          file '05.mp4'
          file '06.mp4'
          file '07.mp4'
          EOF

          ffmpeg -y -f concat -safe 0 -i .tmp/boxing/concat.txt -c copy -movflags +faststart public/media/boxingCombo1.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json public/media/boxingCombo1.mp4
          sha256sum public/media/boxingCombo1.mp4 > public/media/boxingCombo1.sha256

      - name: Commit Boxing Combo 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/boxingCombo1.mp4 public/media/boxingCombo1.sha256
          git commit -m "Add approved Boxing Combo 1 coach motion" || exit 0
          git push
