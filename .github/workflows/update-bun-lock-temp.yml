name: Temporary V2 lockfile reconciliation
on:
  push:
    branches:
      - fix/restore-v2-in-existing-android-20261030
    paths:
      - .github/workflows/update-bun-lock-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reconcile lockfile using original package dependencies
        run: bun install
      - name: Commit only the generated bun.lock to this protected candidate
        run: |
          set -euo pipefail
          git add bun.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync bun.lock with restored V2 dependencies [skip ci]'
          git push origin HEAD:fix/restore-v2-in-existing-android-20261030
