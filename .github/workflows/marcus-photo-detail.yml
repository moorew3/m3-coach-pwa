name: Marcus original-photo-to-3D detail (no paid generation)
on:
  push:
    branches:
      - feature/marcus-photo-detail-20261111
    paths:
      - scripts/marcus_photo_project.py
      - .github/workflows/marcus-photo-detail.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  project-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local image and geometry tools, no paid AI
        run: python -m pip install --quiet pillow numpy
      - name: Project original approved face and tattoo detail onto existing rig texture
        run: python -u scripts/marcus_photo_project.py
      - name: Archive integrity report
        uses: actions/upload-artifact@v4
        with:
          name: marcus-photo-detail-integrity
          path: artifacts/marcus-photo-projection-qa.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve real candidate GLB on review-only branch
        run: |
          test $(wc -c < public/marcus-candidates/marcus-photo-projected-review.glb) -lt 12000000
          git config user.name "M3 Flex Review Bot"
          git config user.email "m3-flex-review@users.noreply.github.com"
          git add public/marcus-candidates/marcus-photo-projected-review.glb
          if ! git diff --cached --quiet; then
            git commit -m "Store isolated photo-projected 24-joint Marcus review GLB"
            git push origin HEAD:feature/marcus-photo-detail-20261111
          fi
