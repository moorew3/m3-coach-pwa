name: M3 FLEX C11 Real Motion Frame Audit
on:
  push:
    branches:
      - production/m3-flex-two-part-masters-2026-10-19
    paths:
      - .github/workflows/m3-flex-c11-motion-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-c11:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Download distinct C11 user-facing generated candidate
        run: |
          set -euo pipefail
          mkdir -p review
          curl -fLsS --retry 2 --max-time 120 \
            'https://resource2.heygen.ai/videos/2f2323079d3c414087f76bbfd67fb0f5/2f2323079d3c414087f76bbfd67fb0f5/01a154f3-ef54-7546-8740-1c488df4c772.mp4' \
            -o review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4
          test "$(stat -c%s review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4)" -gt 50000
          ffprobe -v error -show_format -show_streams -of json review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4 > review/source_probe.json
          sha256sum review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4 > review/SHA256SUMS.txt
      - name: Prepare frame grids and 12 reference frames without modifying source
        run: |
          set -euo pipefail
          mkdir -p review/frames
          ffmpeg -hide_banner -loglevel error -y \
            -i review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4 \
            -vf 'fps=2,scale=360:-1' review/frames/C11_%02d.jpg
          ffmpeg -hide_banner -loglevel error -y \
            -i review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4 \
            -vf 'fps=2,scale=240:-1,tile=5x2:padding=8:margin=8:color=0x17202A' \
            -frames:v 1 review/C11_TEN_FRAME_CONTACT_SHEET.jpg
          ffmpeg -hide_banner -loglevel error -y \
            -i review/C11_HAND_OPEN_R1_UNAPPROVED_SOURCE.mp4 \
            -vf 'fps=1,scale=480:-1,tile=5x1:padding=10:margin=10:color=0x17202A' \
            -frames:v 1 review/C11_FIVE_FRAME_LARGE.jpg
          cat > review/READ_ME_FIRST.txt <<'EOF'
          M3 FLEX C11 — frame-by-frame review only, NO NEW GENERATION.
          The source is HeyGen video 586d74c51f0b46b8a5b0b2c7bfbe6ccf.
          Confirm anatomical LEFT supported white cast, grounded RIGHT sneaker,
          exact approved face/tattoos/cornrows, and two COMPLETE actual finger
          OPEN/CLOSE cycles. Do not confuse moving forearms/waving or camera
          motion with true hand opening. Candidate needs approved Marcus narration
          and owner approval after correct biomechanics. Seven approved clips
          are never touched. No running workout is changed.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: M3-FLEX-C11-FRAME-MOTION-QA-REVIEW-ONLY
          path: review/
          retention-days: 14
