name: Export Hammer Curl Proof

on:
  push:
    branches:
      - work/motion-gap-production
    paths:
      - .github/workflows/export-hammer-curl-proof.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/motion-gap-production

      - name: Download and validate Hammer Curl proof
        run: |
          curl -L --fail --silent --show-error \
            "https://resource2.heygen.ai/tmp/seedance2_output/1a7be86983141e5bd75bb7ef6a276a4a.mp4" \
            -o hammerCurl.mp4
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path("hammerCurl.mp4")
          b=p.read_bytes()
          assert len(b) > 10000, f"file too small: {len(b)}"
          assert b[4:8] == b"ftyp", "invalid MP4 signature"
          Path("hammerCurl-proof-checksum.json").write_text(json.dumps({
            "exercise":"hammerCurl",
            "heygen_video_id":"e93ad0f98ebf4a0e953b842813df288e",
            "bytes":len(b),
            "sha256":hashlib.sha256(b).hexdigest(),
            "qa":"approved"
          }, indent=2)+"\n")
          PY

      - name: Upload to coach media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload coach-media-v1 hammerCurl.mp4 hammerCurl-proof-checksum.json --clobber

      - name: Record checksum audit
        run: |
          mkdir -p docs/motion-audits
          mv hammerCurl-proof-checksum.json docs/motion-audits/hammerCurl-proof-checksum.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/motion-audits/hammerCurl-proof-checksum.json
          git commit -m "Record approved Hammer Curl media checksum" || exit 0
          git push
