name: Verify deployed Marcus original-photo 3D GLB
on:
  push:
    branches:
      - feature/marcus-photo-detail-20261111
    paths:
      - .github/workflows/marcus-photo-live-check.yml
permissions:
  contents: read
jobs:
  live-review-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm actual hosted 3D candidate, owner provenance and original skeleton
        run: |
          python3 - <<'PY'
          import urllib.request, struct, json, hashlib
          base="https://m3-coach-v2-preview-production.up.railway.app"
          def get(path,limit):
              req=urllib.request.Request(base+path,headers={"User-Agent":"M3-Flex-Live-3D-Check"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  status=response.status
                  payload=response.read(limit)
                  mime=response.headers.get("Content-Type","")
              assert status==200,(path,status)
              return payload,mime
          html,mime=get("/marcus-review",2000000)
          assert b"Marcus 3D Candidate" in html and "html" in mime, (mime,len(html))
          data,mime=get("/marcus-candidates/marcus-photo-projected-review.glb",12000000)
          assert data[:4]==b"glTF" and struct.unpack_from("<I",data,8)[0]==len(data)
          jsonlen,kind=struct.unpack_from("<I4s",data,12)
          assert kind==b"JSON"
          meta=json.loads(data[20:20+jsonlen])
          assert len(meta.get("skins",[]))==1
          assert len(meta["skins"][0]["joints"])==24
          assert len(meta.get("animations",[]))>=1
          extras=meta["asset"]["extras"]
          assert extras["asset_code"]=="WM3-20261111-M3FLEX-004"
          assert extras["status"]=="UNAPPROVED_FACE_TATTOO_PROJECTION"
          print("M3_FLEX_LIVE_3D_OK",json.dumps({"page":"200 OK","glb":"200 OK","bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"joints":24,"animationCount":len(meta["animations"]),"identityApproval":False}))
          PY
