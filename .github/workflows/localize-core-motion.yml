name: Localize Core Recovered Motion

on:
  push:
    branches:
      - rebuild/m3-coach-v2
    paths:
      - .github/workflows/localize-core-motion.yml

permissions:
  contents: write

jobs:
  localize-core-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/m3-coach-v2
          persist-credentials: true

      - name: Ensure media tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Download exact recovered treadmill and curl motion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/recovered
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            -A "Mozilla/5.0" \
            "https://twenty-two-gainz-tracker.lovable.app/__l5e/assets-v1/21e0072b-b44f-4e33-b732-1fda2790cb7b/easyWalkV3.mp4" \
            -o public/media/recovered/easyWalkV3.mp4
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            -A "Mozilla/5.0" \
            "https://twenty-two-gainz-tracker.lovable.app/__l5e/assets-v1/0c6f7ce9-22f8-43cc-a979-1e2681e6f9ae/dumbbellCurl.mp4" \
            -o public/media/recovered/dumbbellCurl.mp4

      - name: Validate downloaded motion
        shell: bash
        run: |
          set -euo pipefail
          test -s public/media/recovered/easyWalkV3.mp4
          test -s public/media/recovered/dumbbellCurl.mp4
          ffprobe -v error -show_entries format=duration,size -of json public/media/recovered/easyWalkV3.mp4
          ffprobe -v error -show_entries format=duration,size -of json public/media/recovered/dumbbellCurl.mp4
          sha256sum public/media/recovered/easyWalkV3.mp4 > public/media/recovered/easyWalkV3.sha256
          sha256sum public/media/recovered/dumbbellCurl.mp4 > public/media/recovered/dumbbellCurl.sha256

      - name: Commit localized motion to V2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/recovered/easyWalkV3.mp4 public/media/recovered/easyWalkV3.sha256 \
                  public/media/recovered/dumbbellCurl.mp4 public/media/recovered/dumbbellCurl.sha256
          if git diff --cached --quiet; then
            echo "Motion files already localized."
            exit 0
          fi
          git commit -m "V2: localize treadmill and dumbbell curl motion"
          git push origin HEAD:rebuild/m3-coach-v2
