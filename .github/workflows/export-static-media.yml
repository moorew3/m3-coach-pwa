name: Export Static App Media

on:
  push:
    branches:
      - migration/static-media-export
    paths:
      - static-media-export-manifest.json
      - .github/workflows/export-static-media.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate static media
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, urllib.request

          manifest = json.load(open("static-media-export-manifest.json"))
          out = pathlib.Path("exported-static-media")
          out.mkdir(exist_ok=True)
          checks = []

          for asset in manifest["assets"]:
              name = asset["name"]
              url = asset["url"]
              dest = out / name
              print(f"Downloading {name}")
              req = urllib.request.Request(url, headers={"User-Agent":"GitHub-Actions-M3-Static-Media-Export/1.0"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  data = r.read()
                  content_type = r.headers.get("Content-Type", "")

              if len(data) < 512:
                  raise RuntimeError(f"{name}: file too small ({len(data)} bytes)")

              if asset["kind"] == "png":
                  if data[:8] != b"\x89PNG\r\n\x1a\n":
                      raise RuntimeError(f"{name}: invalid PNG signature")
              else:
                  if data[:2] != b"\xff\xd8":
                      raise RuntimeError(f"{name}: invalid JPEG signature")

              dest.write_bytes(data)
              checks.append({
                  "name": name,
                  "kind": asset["kind"],
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": url,
                  "content_type": content_type,
              })

          json.dump({
              "release": manifest["release"],
              "count": len(checks),
              "assets": checks,
          }, open("static-media-export-checksums.json","w"), indent=2)
          print(f"Validated {len(checks)} assets")
          PY

      - name: Create static media release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-static-media-v1 >/dev/null 2>&1 || \
            gh release create app-static-media-v1 \
              --target main \
              --title "Arm Growth Tracker Static Media v1" \
              --notes "Exact workout guide, exercise-card, mirror-board, and reference-board images exported from the original asset store."

      - name: Upload static media to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload app-static-media-v1 exported-static-media/* static-media-export-checksums.json --clobber

      - name: Save checksum audit in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-media-export-checksums.json
          git commit -m "Record exported static media checksums" || exit 0
          git push
